<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snz / ساناز 🐱</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- Start Screen -->
        <section id="startScreen" class="card">
            <div class="big-cat">🐱</div>

            <h1>Snz / ساناز</h1>

            <p class="gift">
                هدیه کوچیک من به تو 🎁💗
            </p>

            <p class="description">
                با گربه کوچولوت بازی کن و ماهی‌ها و قلب‌ها رو جمع کن! 🐟❤️
            </p>

            <button id="startButton">
                شروع بازی 🎮
            </button>
        </section>


        <!-- Game Screen -->
        <section id="gameScreen" class="hidden">

            <div class="topbar card">

                <div>
                    امتیاز
                    <strong id="score">0</strong>
                </div>

                <div>
                    مرحله
                    <strong id="level">1</strong>
                </div>

                <div>
                    رکورد
                    <strong id="best">0</strong>
                </div>

            </div>


            <div id="game" class="card">

                <div class="cloud cloud1">☁️</div>
                <div class="cloud cloud2">☁️</div>

                <div id="item">🐟</div>

                <div id="cat">🐱</div>

            </div>


            <div class="controls">

                <button id="leftButton">
                    ◀
                </button>

                <button id="rightButton">
                    ▶
                </button>

            </div>

            <p class="help">
                گربه رو حرکت بده و آیتم‌ها رو بگیر 🐾
            </p>

            <button id="restartButton" class="restart">
                دوباره بازی کن 🔄
            </button>

        </section>


        <!-- End Screen -->
        <section id="endScreen" class="card hidden">

            <div class="big-cat">
                😻
            </div>

            <h2>آفرین! 💗</h2>

            <p>
                امتیازت شد:
            </p>

            <div id="finalScore">
                0
            </div>

            <p id="finalMessage">
                گربه خیلی خوشحال شد! 🐾
            </p>

            <button id="againButton">
                دوباره بازی کنیم 🎮
            </button>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
